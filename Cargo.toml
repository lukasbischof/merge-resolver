[package]
name = "merge-resolver"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30.2"
similar = "3.2.1"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
unicode-width = "0.2.3"

[build-dependencies]
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "yaml-load", "regex-onig"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
